name: Changeset Check

on:
    pull_request:
        branches:
            - develop
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Check for changeset
              env:
                  PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
              run: |
                  SKIP_LABELS=(
                    "skip-changelog"
                    "test"
                    "wontfix"
                    "question"
                    "invalid"
                    "documentation"
                    "help wanted"
                    "duplicate"
                    "config"
                  )

                  SKIP=false
                  for label in "${SKIP_LABELS[@]}"; do
                    if echo "${PR_LABELS}" | jq -e --arg label "$label" 'index($label) != null' > /dev/null 2>&1; then
                      echo "ℹ️  PR has '$label' label - changeset not required"
                      SKIP=true
                      break
                    fi
                  done

                  if [ "$SKIP" = true ]; then
                    exit 0
                  fi

                  CHANGESET_FILES=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -type f 2>/dev/null | wc -l)

                  if [ "$CHANGESET_FILES" -eq 0 ]; then
                    echo "❌ No changeset found!"
                    echo ""
                    echo "This PR requires a changeset."
                    echo ""
                    echo "To add a changeset, run:"
                    echo "  pnpm changeset add"
                    echo ""
                    exit 1
                  else
                    echo "✅ Changeset found ($CHANGESET_FILES file(s))"
                  fi
