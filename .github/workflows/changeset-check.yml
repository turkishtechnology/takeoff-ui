name: Changeset Check

# Fail PRs that touch publishable code without a corresponding changeset, so
# nothing accidentally ships without a CHANGELOG entry. Overridable with the
# `skip-changelog` label when a PR is intentionally docs/tooling-only.

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify changeset is present
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
