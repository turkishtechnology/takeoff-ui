name: Require Any PR Label
on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]
    branches:
      - develop

jobs:
  check-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate labels
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (pr.labels.length === 1 && pr.labels[0].name =='core team') {
              core.setFailed("PR must include at least one label other than 'core team'.");
            }
            if (pr.labels.length === 0) {
              core.setFailed("PR must include at least one label before merging.");
            }
