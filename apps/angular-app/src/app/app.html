<div class="container">
  <h1>{{ title() }}</h1>

  <section class="demo-section">
    <h2>Buttons</h2>
    <div class="demo-row">
      <tk-button label="Primary" variant="primary" (tk-click)="onButtonClick()"></tk-button>
      <form [formGroup]="formGroup">
        <tk-input label="harun" formControlName="firstname" />
      </form>
      {{ formGroup.getRawValue() | json }}

      <tk-input label="ng model test" [(ngModel)]="textValue"></tk-input>
      <p>{{ textValue }}</p>
    </div>
  </section>
</div>

<router-outlet />
